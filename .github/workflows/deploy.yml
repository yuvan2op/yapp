name: Test, Build, Push, and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  ECR_REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION || 'ap-south-1' }}.amazonaws.com
  BACKEND_REPOSITORY: ${{ vars.BACKEND_REPOSITORY || 'yapp-backend' }}
  FRONTEND_REPOSITORY: ${{ vars.FRONTEND_REPOSITORY || 'yapp-frontend' }}

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test --workspaces --if-present -- --ci

      - name: Build API
        run: npm run build --workspace api

      - name: Build client
        run: npm run build --workspace client

  build-and-push:
    name: Build and push images
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: true
      matrix:
        include:
          - context: ./api
            service: backend
            cache: backend
          - context: ./client
            service: frontend
            cache: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve image name
        id: image
        run: |
          if [ "${{ matrix.service }}" = "backend" ]; then
            repository="$BACKEND_REPOSITORY"
          else
            repository="$FRONTEND_REPOSITORY"
          fi
          echo "name=${ECR_REGISTRY}/${repository}" >> "$GITHUB_OUTPUT"
          echo "sha=${ECR_REGISTRY}/${repository}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-deploy-role
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for scanning
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          load: true
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.cache }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache }}

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.image.outputs.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          scanners: vuln

      - name: Push scanned image
        run: docker push "${{ steps.image.outputs.sha }}"

  deploy-to-ec2:
    name: Deploy to EC2 through SSM
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Validate required deployment variables
        run: |
          missing=0
          for variable in AWS_ACCOUNT_ID AWS_REGION; do
            if [ -z "${!variable}" ]; then
              echo "Missing required repository variable: $variable"
              missing=1
            fi
          done
          if [ -z "${{ vars.EC2_INSTANCE_ID }}" ]; then
            echo "Missing required repository variable: EC2_INSTANCE_ID"
            missing=1
          fi
          if [ "$missing" -eq 1 ]; then
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-deploy-role
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      - name: Deploy images through AWS Systems Manager
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/yapp' }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          DEPLOY_BRANCH: ${{ vars.DEPLOY_BRANCH || 'main' }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          COMMANDS=$(jq -n \
            --arg path "$DEPLOY_PATH" \
            --arg branch "$DEPLOY_BRANCH" \
            --arg registry "$ECR_REGISTRY" \
            --arg tag "$IMAGE_TAG" \
            --arg region "$AWS_REGION" \
            --arg backend_repository "$BACKEND_REPOSITORY" \
            --arg frontend_repository "$FRONTEND_REPOSITORY" \
            '{commands: [
              "set -e",
              ("cd " + ($path | @sh)),
              "PREV_TAG=$(cat .last-deployed-tag 2>/dev/null || echo \"\")",
              ("git fetch origin " + ($branch | @sh)),
              ("git reset --hard origin/" + ($branch | @sh)),
              ("aws ecr get-login-password --region " + ($region | @sh) + " | docker login --username AWS --password-stdin " + ($registry | @sh)),
              ("export ECR_REGISTRY=" + ($registry | @sh)),
              ("export IMAGE_TAG=" + ($tag | @sh)),
              ("export BACKEND_REPOSITORY=" + ($backend_repository | @sh)),
              ("export FRONTEND_REPOSITORY=" + ($frontend_repository | @sh)),
              "docker compose pull api client",
              "docker compose up -d --no-build --remove-orphans",
              "check_health() { endpoint=\\\"$1\\\"; for attempt in $(seq 1 10); do if curl --fail --silent --show-error --connect-timeout 5 --max-time 10 \\\"$endpoint\\\"; then echo; echo \\\"Healthy: $endpoint\\\"; return 0; fi; echo \\\"Not ready ($attempt/10): $endpoint\\\"; sleep 10; done; return 1; }",
              "if ! check_health http://127.0.0.1:5000/api/health || ! check_health http://127.0.0.1/api/health; then echo \\\"Application health check failed; rolling back\\\"; docker compose ps; docker compose logs --tail=100 api client; if [ -n \\\"$PREV_TAG\\\" ]; then export IMAGE_TAG=\\\"$PREV_TAG\\\"; docker compose pull api client; docker compose up -d --no-build --remove-orphans; echo \\\"Rolled back to $PREV_TAG\\\"; fi; exit 1; fi",
              ("echo " + ($tag | @sh) + " > .last-deployed-tag"),
              "echo \\\"Application is healthy\\\""
            ]}')

          COMMAND_ID=$(aws ssm send-command \
            --document-name 'AWS-RunShellScript' \
            --instance-ids "$EC2_INSTANCE_ID" \
            --comment "Deploy Yapp images ${IMAGE_TAG}" \
            --parameters "$COMMANDS" \
            --query 'Command.CommandId' \
            --output text)

          set +e

          timeout 600 aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"

          SSM_STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query 'Status' \
            --output text)

          echo "SSM command status: $SSM_STATUS"

          echo "===== STANDARD OUTPUT ====="
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query 'StandardOutputContent' \
            --output text

          echo "===== ERROR OUTPUT ====="
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query 'StandardErrorContent' \
            --output text

          if [ "$SSM_STATUS" != "Success" ]; then
            echo "Remote deployment failed"
            exit 1
          fi