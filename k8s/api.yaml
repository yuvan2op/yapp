apiVersion: apps/v1
kind: Deployment
metadata:
  name: yapp-api
  namespace: yapp-api
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: yapp-api
  template:
    metadata:
      labels:
        app: yapp-api
    spec:
      containers:
        - name: api
          image: yapp-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: PORT
              value: "5000"
            - name: MONGODB_URI
              value: mongodb://mongo.api-mongo.svc.cluster.local:27017/yapp_db
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: yapp-api
  namespace: yapp-api
spec:
  type: NodePort
  selector:
    app: yapp-api
  ports:
    - name: http
      port: 5000
      targetPort: http
      nodePort: 32000
