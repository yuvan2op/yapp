apiVersion: apps/v1
kind: Deployment
metadata:
  name: yapp-client
  namespace: yapp-client
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: yapp-client
  template:
    metadata:
      labels:
        app: yapp-client
    spec:
      containers:
        - name: client
          image: yapp-client:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: yapp-client
  namespace: yapp-client
spec:
  type: NodePort
  selector:
    app: yapp-client
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 32001
